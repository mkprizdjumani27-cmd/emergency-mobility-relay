[project]
name = "vehicle-allocation"
version = "0.1.0"
description = "Emergency Mobility Relay System - Vehicle Allocation Module"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.2",
    "pandas>=2.0",
    "ortools>=9.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vehicle_allocation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
